name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-test:
    name: Backend - typecheck & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mygym
          POSTGRES_PASSWORD: mygym
          POSTGRES_DB: mygym_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mygym -d mygym_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://mygym:mygym@localhost:5432/mygym_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  frontend-build:
    name: Frontend - typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  mcp-server-test:
    name: MCP server - typecheck & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: Deploy to VPS
    # Only after all checks are green, and only for pushes to main (never
    # for pull requests).
    needs: [backend-test, frontend-build, mcp-server-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /root/MyGym
            OLD_HEAD=$(git rev-parse HEAD)
            git pull origin main
            docker compose up -d --build
            # nginx renders its config from nginx/templates only when the
            # container starts, and `up` doesn't recreate it for a changed
            # mounted file - restart it ourselves, only when nginx/ changed.
            if ! git diff --quiet "$OLD_HEAD" HEAD -- nginx/; then
              docker compose restart nginx
            fi
            docker image prune -f
