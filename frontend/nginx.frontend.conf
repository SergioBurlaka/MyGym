# Serves the built SPA. This container only knows how to serve static
# files - the top-level nginx/ reverse proxy is what the outside world
# actually talks to and what routes /api/* to the backend.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html (and the other unhashed files: favicon, manifest) must be
    # revalidated on every load - otherwise Android Chrome heuristically
    # caches index.html for hours and keeps loading an old JS bundle after
    # a deploy (seen as the numeric keyboard bug "coming back").
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # The PWA manifest: explicit type (spec'd application/manifest+json, not
    # whatever mime.types maps .webmanifest to) and no-cache, so a changed
    # name/colour/icon list reaches installed apps. default_type only applies
    # when the extension isn't in mime.types, so clear the map here.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Icons referenced by the manifest: a wrong path should be a visible 404,
    # not index.html served as image/png via the SPA fallback above.
    location /icons/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Vite puts a content hash in every file name under /assets/, so a new
    # build always gets new URLs - these can be cached forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
