<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Календар — уся історія прокруткою</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#14171c}
a{color:#ff8a55}a:hover{color:#ffb08c}
button{font-family:inherit}
button:focus-visible,a:focus-visible{outline:2px solid #ff8a55;outline-offset:2px}
.scroll > *{flex-shrink:0}
.scroll::-webkit-scrollbar{width:0}
.hs{scrollbar-width:thin;scrollbar-color:#3a4150 transparent}
.hs::-webkit-scrollbar{height:4px}.hs::-webkit-scrollbar-thumb{background:#3a4150;border-radius:2px}
@keyframes expand{0%{opacity:0;transform:translateY(-4px)}100%{opacity:1;transform:none}}
.expand{animation:expand .2s cubic-bezier(.23,1,.32,1) both}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: #14171c; font-family: Inter, system-ui, sans-serif; color: #e9ecf2; display: flex; flex-direction: column">
<header style="height: 60px; flex-shrink: 0; box-sizing: border-box; padding: 0 12px 0 16px; border-bottom: 1px solid #262c38; display: flex; align-items: center">
<img src="/_blob/b1a21daa1baf0690a4dcabda4092e29c" alt="MyGym" style="height: 34px; width: auto; display: block">
<span style="flex-grow: 1"></span>
<button aria-label="Меню" style="width: 44px; height: 44px; border: 0; background: transparent; color: #e9ecf2; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
</header>
<div class="scroll" style="flex: 1 1 auto; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 12px">
<h1 style="margin: 0; flex-grow: 1; font-size: 28px; font-weight: 700; line-height: 1.1">Журнал тренувань</h1>
<button style="height: 48px; padding: 0 14px; border: 0; border-radius: 12px; background: #ff5a36; color: #14171c; font: 800 14px Inter, sans-serif">+ Нове тренування</button>
</div>
<section style="border-radius: 16px; background: #1c2028; border: 1px solid #2a2f3a; padding: 16px 14px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: baseline; gap: 8px"><h2 style="margin: 0; flex-grow: 1; font-size: 18px; font-weight: 600">Календар консистентності</h2><span style="font-size: 12px; color: #828a99">з липня 2026</span></div>
<div style="display: flex; gap: 6px">
<div aria-hidden="true" style="display: flex; flex-direction: column; gap: 4px; flex-shrink: 0">
<span style="height: 16px"></span>
<sc-for list="{{weekdays}}" as="w" hint-placeholder-count="7"><span style="height: 22px; font-size: 11px; line-height: 22px; color: #9aa2b1">{{w.w}}</span></sc-for>
</div>
<div class="hs" ref="{{scrollRef}}" role="group" aria-label="Тижні з липня 2026 до сьогодні. Гортайте вліво — раніші тижні" style="flex: 1 1 auto; min-width: 0; overflow-x: auto; display: flex; gap: 4px; padding-bottom: 8px; scroll-snap-type: x proximity">
<sc-for list="{{colsA}}" as="c" hint-placeholder-count="18">
<div style="display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; scroll-snap-align: end">
<span style="height: 16px; width: 22px; font-size: 11px; line-height: 16px; color: #b4bbc8; white-space: nowrap; overflow: visible">{{c.month}}</span>
<sc-for list="{{c.days}}" as="d" hint-placeholder-count="7"><button onClick="{{d.pick}}" disabled="{{d.dead}}" aria-label="{{d.aria}}" style="width: 22px; height: 22px; border: 0; border-radius: 5px; background: {{d.bg}}; box-shadow: {{d.ring}}; padding: 0; cursor: pointer"></button></sc-for>
</div>
</sc-for>
</div>
</div>
<span style="margin-top: -6px; font-size: 12px; color: #828a99">← гортайте вліво, щоб побачити раніші тижні</span>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
// Mock history: first workout 1 Jul 2026, today Sat 31 Oct 2026.
var TODAY = '2026-10-31';
var START = '2026-07-01';
var MON = ['січ.', 'лют.', 'бер.', 'квіт.', 'трав.', 'черв.', 'лип.', 'серп.', 'вер.', 'жовт.', 'лист.', 'груд.'];
var MONF = ['Січень', 'Лютий', 'Березень', 'Квітень', 'Травень', 'Червень', 'Липень', 'Серпень', 'Вересень', 'Жовтень', 'Листопад', 'Грудень'];
var MONG = ['січня', 'лютого', 'березня', 'квітня', 'травня', 'червня', 'липня', 'серпня', 'вересня', 'жовтня', 'листопада', 'грудня'];
var WD = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'нд'];
var COLOR = { planned: '#3ddc97', extra: '#0ea5e9', missed: '#ef4444', rest: '#2a2f3a', future: '#1f242d', before: '#1f242d' };
function d2s(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function s2d(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function add(s, n) { var d = s2d(s); d.setDate(d.getDate() + n); return d2s(d); }
function wdi(s) { return (s2d(s).getDay() + 6) % 7; }
function monday(s) { return add(s, -wdi(s)); }
function hash(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
var A = ['Тяга в нахилі', 'Станова тяга', 'Жим стоячи', 'Віджимання', 'Французький жим', 'Розведення стоячи'];
var B = ['Присідання', 'Випади', 'Жим лежачи', 'Тяга в нахилі', 'Біцепс', 'Розведення в нахилі'];
function dayInfo(s) {
  if (s < START) return { state: 'before' };
  if (s > TODAY) return { state: 'future' };
  var w = wdi(s), planned = w === 0 || w === 2 || w === 4, h = hash(s) % 100;
  if (s === TODAY) return { state: 'rest', today: true };
  if (planned) {
    if (h < 14) return { state: 'missed' };
    var n = Math.floor((s2d(s) - s2d(START)) / 86400000);
    var lab = Math.floor(n / 2) % 2 ? 'Б' : 'А';
    return { state: 'planned', label: lab, ex: lab === 'А' ? A : B };
  }
  if ((w === 1 || w === 5) && h < 22) return { state: 'extra', label: 'прес + підтягування', ex: ['Підняття ніг на прес', 'Підтягування'] };
  return { state: 'rest' };
}
function nice(s) { var d = s2d(s); return d.getDate() + ' ' + MONG[d.getMonth()] + ', ' + WD[wdi(s)]; }
function detail(s) {
  var i = dayInfo(s);
  var t = { planned: 'План виконано', extra: 'Бонусне тренування', missed: 'Пропущено — за розкладом був день тренування', rest: i.today ? 'Сьогодні' : 'Вихідний' }[i.state] || '';
  return { date: nice(s), text: t, label: i.label || '', ex: i.ex ? i.ex.join(', ') : '', dot: COLOR[i.state] || COLOR.rest, has: !!i.ex, hasLabel: !!i.label };
}
// All weeks from the first workout's Monday to this week.
function allWeeks() {
  var res = [], m = monday(START), last = monday(TODAY);
  while (m <= last) { res.push(m); m = add(m, 7); }
  return res;
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    var weeks = allWeeks();
    this.state = { sel: '2026-10-30', month: 9, year: 2026, page: 0, open: false, weeksN: weeks.length };
  }
  componentDidMount() {
    // Variant A: start scrolled to today (the right edge).
    var el = this._scroll;
    if (el) el.scrollLeft = el.scrollWidth;
  }
  cell(s, size) {
    var self = this, i = dayInfo(s), selected = this.state.sel === s;
    var dead = i.state === 'before' || i.state === 'future';
    return {
      s: s, bg: COLOR[i.state], ring: i.today ? 'inset 0 0 0 1.5px #ff8a55' : 'none',
      aria: nice(s) + (dead ? '' : ': ' + detail(s).text), dead: dead,
      n: s2d(s).getDate(), fg: i.state === 'planned' || i.state === 'extra' ? '#0b0e13' : (dead ? '#3a4150' : '#9aa2b1'),
      fw: i.today ? 800 : 600,
      pick: dead ? null : function () { self.setState({ sel: s }); }
    };
  }
  stats(from, to) {
    var planned = 0, done = 0, extra = 0;
    for (var s = from; s <= to; s = add(s, 1)) {
      var i = dayInfo(s);
      if (i.state === 'planned') { planned++; done++; }
      if (i.state === 'missed') planned++;
      if (i.state === 'extra') extra++;
    }
    return { done: done, planned: planned, extra: extra, pct: planned ? Math.round(done * 100 / planned) : 0 };
  }
  renderVals() {
    var self = this, st = this.state;
    var weeks = allWeeks();
    // Variant A: all weeks, horizontal scroll, month label on the first week of a month.
    var colsA = weeks.map(function (m, k) {
      var days = []; for (var d = 0; d < 7; d++) days.push(self.cell(add(m, d)));
      var first = s2d(m), prev = k ? s2d(weeks[k - 1]) : null;
      var lab = (!prev || first.getMonth() !== prev.getMonth()) ? MON[first.getMonth()] : '';
      return { days: days, month: lab };
    });
    // Variant B: month grid.
    var y = st.year, mo = st.month;
    var firstDay = d2s(new Date(y, mo, 1)), lastDay = d2s(new Date(y, mo + 1, 0));
    var gridStart = monday(firstDay), cellsB = [];
    for (var k = 0; k < 42; k++) {
      var s = add(gridStart, k);
      var c = self.cell(s); c.out = s.slice(0, 7) !== firstDay.slice(0, 7);
      c.opacity = c.out ? 0.35 : 1;
      if (k >= 35 && s > lastDay) break;
      cellsB.push(c);
    }
    var minM = 6, minY = 2026; // July 2026
    var canPrev = y > minY || mo > minM, canNext = y < 2026 || mo < 9;
    var sb = self.stats(firstDay < START ? START : firstDay, lastDay > TODAY ? TODAY : lastDay);
    // Variant C: last 16 weeks full width, "all history" opens month blocks (newest first).
    var last16 = weeks.slice(-16).map(function (m) {
      var days = []; for (var d = 0; d < 7; d++) days.push(self.cell(add(m, d)));
      return { days: days };
    });
    var monthsC = [];
    for (var mm = 9; mm >= 6; mm--) {
      var f = d2s(new Date(2026, mm, 1)), l = d2s(new Date(2026, mm + 1, 0));
      var gs = monday(f), wk = [];
      for (var w = 0; gs <= l; w++, gs = add(gs, 7)) {
        var row = []; for (var d = 0; d < 7; d++) { var s2 = add(gs, d); var cc = self.cell(s2); cc.opacity = s2.slice(0, 7) !== f.slice(0, 7) ? 0 : 1; row.push(cc); }
        wk.push({ days: row });
      }
      var stc = self.stats(f < START ? START : f, l > TODAY ? TODAY : l);
      monthsC.push({ title: MONF[mm] + ' 2026', weeks: wk, sum: stc.done + ' з ' + stc.planned + ' за планом' + (stc.extra ? ' · +' + stc.extra + ' бонусних' : '') });
    }
    var stAll = self.stats(START, TODAY);
    var det = detail(st.sel);
    return {
      colsA: colsA, weekdays: ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд'].map(function (w) { return { w: w }; }),
      scrollRef: function (el) { self._scroll = el; },
      monthTitle: MONF[mo] + ' ' + y, cellsB: cellsB,
      prev: function () { if (canPrev) self.setState({ month: mo === 0 ? 11 : mo - 1, year: mo === 0 ? y - 1 : y }); },
      next: function () { if (canNext) self.setState({ month: mo === 11 ? 0 : mo + 1, year: mo === 11 ? y + 1 : y }); },
      first: function () { self.setState({ month: minM, year: minY }); },
      prevFg: canPrev ? '#e9ecf2' : '#3a4150', nextFg: canNext ? '#e9ecf2' : '#3a4150',
      disPrev: !canPrev, disNext: !canNext,
      today: function () { self.setState({ month: 9, year: 2026 }); },
      monthSum: sb.done + ' з ' + sb.planned + ' за планом · ' + sb.pct + '%' + (sb.extra ? ' · +' + sb.extra + ' бонусних' : ''),
      last16: last16, monthsC: monthsC, open: st.open,
      toggleOpen: function () { self.setState({ open: !st.open }); },
      openLabel: st.open ? 'Згорнути' : 'Уся історія з липня 2026',
      chev: st.open ? 'rotate(180deg)' : 'none',
      allSum: 'З 1 липня: ' + stAll.done + ' з ' + stAll.planned + ' за планом (' + stAll.pct + '%) · +' + stAll.extra + ' бонусних',
      det: det
    };
  }
}

</script>
</body>
</html>
