<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var TABS = [['journal','Журнал','Журнал тренувань'],['programs','Програми','Програми'],['progress','Прогрес','Прогрес по вправах'],['exercises','Вправи','Вправи'],['more','Додатково','']];
var MORE = [['schedule','Розклад','calendar'],['import','Імпорт','import'],['integrations','Інтеграції','plug']];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'journal', sub: null, open: 'none', lang: 'uk' }; }
  renderVals() {
    var self = this, s = this.state;
    var subTitle = s.sub ? MORE.filter(function (m) { return m[0] === s.sub; })[0][1] : null;
    var v = {
      pageTitle: subTitle || TABS.filter(function (t) { return t[0] === s.tab; })[0][2],
      userOpen: s.open === 'user', moreOpen: s.open === 'more',
      avaBg: s.open === 'user' ? '#3a4150' : '#262c38',
      toggleUser: function () { self.setState({ open: s.open === 'user' ? 'none' : 'user' }); },
      closeAll: function () { self.setState({ open: 'none' }); },
      tabsArr: TABS.map(function (t) {
        var on = t[0] === 'more' ? (s.open === 'more' || !!s.sub) : (t[0] === s.tab && !s.sub && s.open !== 'more');
        return { current: on && t[0] !== 'more' ? 'page' : 'false',
          fg: on ? '#ff5a36' : '#9aa2b1', bg: on ? 'rgba(255,90,54,0.14)' : 'transparent',
          pick: function () { if (t[0] === 'more') self.setState({ open: s.open === 'more' ? 'none' : 'more' }); else self.setState({ tab: t[0], sub: null, open: 'none' }); } };
      }),
      moreArr: MORE.map(function (m) {
        var on = s.sub === m[0];
        return { bg: on ? 'rgba(255,90,54,0.10)' : 'transparent', ic: on ? '#ff5a36' : '#9aa2b1',
          pick: function () { self.setState({ sub: m[0], open: 'none' }); } };
      }),
      langs: [['en', 'EN'], ['uk', 'УКР']].map(function (l) {
        var on = s.lang === l[0];
        return { label: l[1], on: on ? 'true' : 'false', bg: on ? '#ff6b2c' : 'transparent', fg: on ? '#14171c' : '#e9ecf2',
          pick: function () { self.setState({ lang: l[0] }); } };
      })
    };
    v.tabsArr.forEach(function (t, i) { for (var key in t) v['tab_' + TABS[i][0] + '_' + key] = t[key]; });
    v.moreArr.forEach(function (m, i) { for (var key in m) v['more_' + MORE[i][0] + '_' + key] = m[key]; });
    return v;
  }
}
</script>
