<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var TABS = [['journal','Журнал тренувань'],['programs','Програми'],['progress','Прогрес по вправах'],['exercises','Вправи'],['more','']];
var MORE = [['schedule','Розклад'],['import','Імпорт'],['integrations','Інтеграції']];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'journal', sub: null, open: 'none' }; }
  renderVals() {
    var self = this, s = this.state;
    var subT = s.sub ? MORE.filter(function (m) { return m[0] === s.sub; })[0][1] : null;
    var v = {
      pageTitle: subT || TABS.filter(function (t) { return t[0] === s.tab; })[0][1],
      userOpen: s.open === 'user', moreOpen: s.open === 'more',
      toggleUser: function () { self.setState({ open: s.open === 'user' ? 'none' : 'user' }); },
      closeAll: function () { self.setState({ open: 'none' }); }
    };
    TABS.forEach(function (t) {
      var on = t[0] === 'more' ? (s.open === 'more' || !!s.sub) : (t[0] === s.tab && !s.sub && s.open !== 'more');
      var k = 'tab_' + t[0] + '_';
      v[k + 'fg'] = on ? '#ff5a36' : '#8b93a3';
      v[k + 'bg'] = on ? 'rgba(255,90,54,0.16)' : 'transparent';
      v[k + 'lbl'] = on ? '#f1f3f7' : '#8b93a3';
      v[k + 'on'] = on ? 1 : 0;
      v[k + 'current'] = on && t[0] !== 'more' ? 'page' : 'false';
      v[k + 'pick'] = function () { if (t[0] === 'more') self.setState({ open: s.open === 'more' ? 'none' : 'more' }); else self.setState({ tab: t[0], sub: null, open: 'none' }); };
    });
    MORE.forEach(function (m) { v['more_' + m[0] + '_pick'] = function () { self.setState({ sub: m[0], open: 'none' }); }; });
    return v;
  }
}
</script>
