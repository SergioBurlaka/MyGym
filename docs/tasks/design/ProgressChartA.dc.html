<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Прогрес — графік прокруткою</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#14171c}
a{color:#ff8a55}a:hover{color:#ffb08c}
button{font-family:inherit}
button:focus-visible{outline:2px solid #ff8a55;outline-offset:2px}
.scroll > *{flex-shrink:0}
.scroll::-webkit-scrollbar{width:0}
.hs{scrollbar-width:thin;scrollbar-color:#3a4150 transparent;overscroll-behavior-x:contain}
.hs::-webkit-scrollbar{height:4px}.hs::-webkit-scrollbar-thumb{background:#3a4150;border-radius:2px}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: #14171c; font-family: Inter, system-ui, sans-serif; color: #e9ecf2; display: flex; flex-direction: column">
<header style="height: 60px; flex-shrink: 0; box-sizing: border-box; padding: 0 8px 0 12px; border-bottom: 1px solid #262c38; display: flex; align-items: center">
<img src="/_blob/b1a21daa1baf0690a4dcabda4092e29c" alt="MyGym" style="height: 34px; width: auto; display: block">
<span style="flex-grow: 1"></span>
<button aria-label="Меню" style="width: 44px; height: 44px; border: 0; background: transparent; color: #e9ecf2; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
</header>
<div class="scroll" style="flex: 1 1 auto; overflow-y: auto; padding: 16px 12px 24px; display: flex; flex-direction: column; gap: 14px">
<h1 style="margin: 0; font-size: 28px; font-weight: 700">Прогрес по вправах</h1>
<section style="border-radius: 16px; background: #1c2028; border: 1px solid #2a2f3a; padding: 14px 12px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px"><h2 style="margin: 0; font-size: 17px; font-weight: 600">Обсяг за тиждень</h2><span style="font-size: 13px; color: #9aa2b1">Баланс великих і малих груп м'язів</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: #b4bbc8">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #3b82f6"></span>Великі групи, кг</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #d0609b"></span>Малі групи, кг</span>
</div>
<div style="display: flex; gap: 6px">
<div aria-hidden="true" style="position: relative; width: 34px; height: 168px; flex-shrink: 0">
<sc-for list="{{ticks}}" as="k" hint-placeholder-count="4"><span style="position: absolute; right: 0; top: {{k.top}}; transform: translateY(-50%); font-size: 10px; color: #9aa2b1; white-space: nowrap">{{k.v}}</span></sc-for>
</div>
<div class="hs" ref="{{scrollRef}}" role="group" aria-label="Обсяг по тижнях з липня 2026; гортайте вліво — раніші тижні" style="flex: 1 1 auto; min-width: 0; overflow-x: auto; position: relative">
<div style="position: relative; display: flex; width: max-content">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 168px; border-top: 1px dashed #2a2f3a; pointer-events: none"></div>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 56px; height: 0; border-top: 1px dashed #2a2f3a; pointer-events: none"></div>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 112px; height: 0; border-top: 1px dashed #2a2f3a; pointer-events: none"></div>
<sc-for list="{{colsA}}" as="c" hint-placeholder-count="17">
<button onClick="{{c.pick}}" aria-label="{{c.aria}}" style="position: relative; width: 30px; border: 0; padding: 0; background: {{c.bg}}; border-radius: 6px; display: flex; flex-direction: column; align-items: center; cursor: pointer">
<span style="height: 168px; display: flex; align-items: flex-end; gap: 2px; border-bottom: 1px solid #3a4150; width: 100%; justify-content: center"><span style="width: 10px; height: {{c.lh}}; background: #3b82f6; border-radius: 3px 3px 0 0"></span><span style="width: 10px; height: {{c.sh}}; background: #d0609b; border-radius: 3px 3px 0 0"></span></span>
<span style="height: 20px; font-size: 10px; line-height: 20px; color: #9aa2b1; white-space: nowrap; overflow: visible">{{c.label}}</span>
</button>
</sc-for>
</div>
</div>
</div>
<div aria-live="polite" style="border-radius: 10px; background: #14171c; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px">
<b style="font-size: 13px">{{selTitle}}</b>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; font-size: 12px; color: #9aa2b1">
<span style="display: flex; flex-direction: column; gap: 1px"><span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 2px; background: #3b82f6"></span>Великі</span><b style="font-size: 14px; color: #fff">{{selLarge}}</b></span>
<span style="display: flex; flex-direction: column; gap: 1px"><span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 2px; background: #d0609b"></span>Малі</span><b style="font-size: 14px; color: #fff">{{selSmall}}</b></span>
<span style="display: flex; flex-direction: column; gap: 1px"><span>Без ваги</span><b style="font-size: 14px; color: #fff">{{selBw}}</b></span>
</div>
</div>
<span style="font-size: 12px; color: #828a99">← гортайте вліво — уся історія · тап по тижню — числа</span>
</section>
<div style="display: flex; align-items: baseline; gap: 8px; margin-top: 4px"><h2 style="margin: 0; flex-grow: 1; font-size: 13px; font-weight: 700; letter-spacing: .06em; color: #9aa2b1">ВПРАВИ · ДО «СПРОБУЙ БІЛЬШЕ»</h2></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="16">
<button onClick="{{c.pick}}" style="min-height: 76px; box-sizing: border-box; border-radius: 12px; border: 1px solid {{c.border}}; background: {{c.bg}}; color: #e9ecf2; padding: 10px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; cursor: pointer">
<span class="clamp" style="font-size: 14px; font-weight: 600; line-height: 1.3">{{c.name}}</span>
<sc-if value="{{c.has}}" hint-placeholder-val="{{ true }}"><span style="display: flex; flex-direction: column; gap: 5px; width: 100%"><span style="font-size: 12px; color: #9aa2b1"><b style="color: #fff; font-size: 13px">{{c.count}}</b> тренувань</span><span style="display: flex; gap: 3px; width: 100%"><sc-for list="{{c.segs}}" as="g" hint-placeholder-count="4"><span style="flex: 1 1 0; height: 5px; border-radius: 3px; background: {{g.c}}"></span></sc-for></span></span></sc-if>
<sc-if value="{{c.none}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #828a99">Ще не виконувалась</span></sc-if>
</button>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
// Real weeks from prod (/api/progression/volume-by-category?weeks=12, 2026-10-31),
// July weeks before them are mock: the API only returns 12 weeks today.
var WEEKS = [
  { w: '2026-07-06', large: 7120, small: 2410, bw: 160 },
  { w: '2026-07-13', large: 7980, small: 2620, bw: 180 },
  { w: '2026-07-20', large: 6540, small: 2230, bw: 140 },
  { w: '2026-07-27', large: 8310, small: 2950, bw: 175 },
  { w: '2026-08-03', large: 0, small: 0, bw: 51 },
  { w: '2026-08-10', large: 8786, small: 3699, bw: 212 },
  { w: '2026-08-17', large: 11436, small: 3282, bw: 213 },
  { w: '2026-08-24', large: 8900, small: 4218, bw: 285 },
  { w: '2026-08-31', large: 12023, small: 3624, bw: 219 },
  { w: '2026-09-07', large: 7689, small: 2811, bw: 183 },
  { w: '2026-09-14', large: 10019, small: 4707, bw: 122 },
  { w: '2026-09-21', large: 13708, small: 3946, bw: 156 },
  { w: '2026-09-28', large: 2411, small: 1998, bw: 36 },
  { w: '2026-10-05', large: 8720, small: 3063, bw: 38 },
  { w: '2026-10-12', large: 9016, small: 3186, bw: 39 },
  { w: '2026-10-19', large: 9182, small: 3226, bw: 100 },
  { w: '2026-10-26', large: 16072, small: 4361, bw: 121 }
];
var EX = [
  ['Підняття ніг на прес (шведська стінка)', 4, 5], ['Жим штанги лежачи', 2, 4], ['Випади', 1, 4], ['Присідання', 1, 4],
  ['Станова тяга', 1, 4], ['Віджимання', 1, 5], ['Жим стоячи', 2, 6], ['Підтягування', 1, 5],
  ['Розведення в нахилі в сторону', 2, 6], ['Тяга в нахилі', 0, 4], ['Французький жим сидячи', 2, 6], ['Бруса', 0, 5],
  ['Піднімання на біцепс', 1, 6], ['Підняття корпусу на прес', 0, 5], ['Розведення в сторону стоячи', 1, 6], ['Біг 100 м', null, null]
];
var C = { large: '#3b82f6', small: '#d0609b', bw: '#e5b23a' };
var MONG = ['січ.', 'лют.', 'бер.', 'квіт.', 'трав.', 'черв.', 'лип.', 'серп.', 'вер.', 'жовт.', 'лист.', 'груд.'];
function dm(s) { var p = s.split('-'); return p[2] + '.' + p[1]; }
function addD(s, n) { var p = s.split('-'); var d = new Date(+p[0], +p[1] - 1, +p[2] + n); return String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0'); }
function kg(n) { return Math.round(n).toLocaleString('uk-UA').replace(/,/g, ' '); }
function t(n) { return n >= 1000 ? (Math.round(n / 100) / 10).toLocaleString('uk-UA') + ' т' : Math.round(n) + ' кг'; }
function niceMax(v) { var s = [5000, 10000, 15000, 20000, 25000, 30000]; for (var i = 0; i < s.length; i++) if (v <= s[i]) return s[i]; return Math.ceil(v / 5000) * 5000; }

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: WEEKS.length - 1, shown: 8, range: 12, ex: 0 };
  }
  componentDidMount() { var el = this._scroll; if (el) el.scrollLeft = el.scrollWidth; }
  renderVals() {
    var self = this, s = this.state, H = 168;
    // ---- A: all weeks, scroll sideways ----
    var maxA = niceMax(Math.max.apply(null, WEEKS.map(function (w) { return Math.max(w.large, w.small); })));
    var colsA = WEEKS.map(function (w, i) {
      return {
        lh: Math.max(w.large ? 2 : 0, Math.round(w.large / maxA * H)) + 'px', sh: Math.max(w.small ? 2 : 0, Math.round(w.small / maxA * H)) + 'px',
        label: i % 2 === (WEEKS.length - 1) % 2 ? dm(w.w) : '', bg: s.sel === i ? 'rgba(255,255,255,0.06)' : 'transparent',
        aria: 'Тиждень з ' + dm(w.w) + ': великі ' + kg(w.large) + ' кг, малі ' + kg(w.small) + ' кг, без ваги ' + w.bw + ' повт.',
        pick: function () { self.setState({ sel: i }); }
      };
    });
    var ticks = [0, 1, 2, 3].map(function (k) { var v = maxA * (3 - k) / 3; return { v: k === 3 ? '0' : t(v), top: Math.round(k * H / 3) + 'px' }; });
    var sw = WEEKS[s.sel];
    // ---- B: weeks as rows, newest first ----
    var maxB = Math.max.apply(null, WEEKS.map(function (w) { return w.large + w.small; }));
    var rowsB = WEEKS.slice().reverse().slice(0, s.shown).map(function (w) {
      var tot = w.large + w.small;
      return {
        range: dm(w.w) + '–' + addD(w.w, 6), lw: (w.large / maxB * 100).toFixed(1) + '%', sw: (w.small / maxB * 100).toFixed(1) + '%',
        hasL: w.large > 0, hasS: w.small > 0, total: tot ? t(tot) : '—',
        sub: 'великі ' + kg(w.large) + ' · малі ' + kg(w.small) + ' кг · без ваги ' + w.bw + ' повт.'
      };
    });
    // ---- C: period switch + tiles + compact chart ----
    var n = s.range === 0 ? WEEKS.length : s.range, slice = WEEKS.slice(-n);
    var maxC = niceMax(Math.max.apply(null, slice.map(function (w) { return Math.max(w.large, w.small); })));
    var selC = Math.min(s.sel, WEEKS.length - 1); if (selC < WEEKS.length - n) selC = WEEKS.length - 1;
    var colsC = slice.map(function (w, k) {
      var i = WEEKS.length - n + k;
      return { lh: Math.round(w.large / maxC * 140) + 'px', sh: Math.round(w.small / maxC * 140) + 'px', bg: selC === i ? 'rgba(255,255,255,0.07)' : 'transparent',
        aria: 'Тиждень з ' + dm(w.w), pick: function () { self.setState({ sel: i }); } };
    });
    var avg = function (key) { var a = slice.reduce(function (x, w) { return x + w[key]; }, 0) / slice.length; return a; };
    var cw = WEEKS[selC];
    function tile(key, name, unit) {
      var v = cw[key], a = avg(key), d = a ? Math.round((v - a) / a * 100) : 0;
      return { name: name, color: C[key], value: unit === 'повт.' ? v + ' повт.' : t(v), sub: (d >= 0 ? '↑ ' : '↓ ') + Math.abs(d) + '% від середнього', subFg: d >= 0 ? '#3ddc97' : '#f59e8b' };
    }
    var seg = [[4, '4 тижні'], [12, '12 тижнів'], [0, 'Уся історія']].map(function (o) {
      var on = s.range === o[0];
      return { label: o[1], on: on, bg: on ? '#2a2f3a' : 'transparent', fg: on ? '#fff' : '#9aa2b1', pick: function () { self.setState({ range: o[0], sel: WEEKS.length - 1 }); } };
    });
    // ---- exercises (same in all) ----
    var chips = EX.map(function (e, i) {
      var segs = []; if (e[2]) for (var k = 0; k < e[2]; k++) segs.push({ c: k < e[1] ? '#ff5a36' : '#3a4150' });
      return { name: e[0], has: e[2] != null, none: e[2] == null, count: e[1] + ' з ' + e[2], segs: segs,
        border: s.ex === i ? 'rgba(255,90,54,0.7)' : '#2a2f3a', bg: s.ex === i ? 'rgba(255,90,54,0.08)' : '#1c2028',
        pick: function () { self.setState({ ex: i }); } };
    });
    return {
      colsA: colsA, ticks: ticks, scrollRef: function (el) { self._scroll = el; },
      selTitle: 'Тиждень ' + dm(sw.w) + '–' + addD(sw.w, 6), selLarge: kg(sw.large) + ' кг', selSmall: kg(sw.small) + ' кг', selBw: sw.bw + ' повт.',
      rowsB: rowsB, more: WEEKS.length > s.shown, showMore: function () { self.setState({ shown: s.shown + 8 }); },
      moreLabel: 'Раніші тижні · ще ' + Math.min(8, WEEKS.length - s.shown),
      seg: seg, colsC: colsC, tiles: [tile('large', 'Великі групи', 'кг'), tile('small', 'Малі групи', 'кг'), tile('bw', 'Без ваги', 'повт.')],
      cTitle: 'Тиждень ' + dm(cw.w) + '–' + addD(cw.w, 6) + (selC === WEEKS.length - 1 ? ' · поточний' : ''),
      cMax: t(maxC), cFrom: dm(slice[0].w), cTo: dm(slice[slice.length - 1].w),
      bwLine: WEEKS.slice(-8).map(function (w) { return { h: Math.round(w.bw / 300 * 28) + 'px' }; }),
      chips: chips
    };
  }
}

</script>
</body>
</html>
