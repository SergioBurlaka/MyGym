<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Тренування — снаряд і кінцівки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#151922}
a{color:#ff8a55}a:hover{color:#ffb08c}
input,select{font-family:inherit}
input.ph::placeholder{color:#828a99;font-weight:500;opacity:1}
input.ph-up::placeholder{color:#d08561;font-weight:600;opacity:1}
input.ph:focus,input.ph-up:focus,select:focus{border-color:#ff6b2c;outline:none}
</style>
</helmet>
<div style="width: 390px; min-height: 2600px; box-sizing: border-box; background: #151922; font-family: Inter, system-ui, sans-serif; color: #e9ecf2; display: flex; flex-direction: column">
<header style="height: 64px; box-sizing: border-box; padding: 0 12px 0 16px; border-bottom: 1px solid #262c38; display: flex; align-items: center; gap: 10px">
<div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0">
<div style="width: 36px; height: 36px; border-radius: 9px; background: #ff6b2c; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 0.9; font-weight: 900; font-size: 11px; color: #fff"><span>My</span><span style="color: #1b1f28">Gym</span></div>
<span style="font-weight: 900; font-size: 19px; letter-spacing: -0.4px">My<span style="color: #ff6b2c">Gym</span></span>
</div>
<div style="flex-grow: 1; display: flex; justify-content: center">
<button aria-label="Поставити таймер на паузу" style="height: 44px; box-sizing: border-box; padding: 0 6px 0 12px; border-radius: 12px; border: 1px solid #2c3240; background: #1d222c; color: #fff; display: flex; align-items: center; gap: 8px; font: 700 17px Inter, sans-serif; font-variant-numeric: tabular-nums">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff6b2c" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2M9.5 2.5h5"></path></svg>19:54
<span style="width: 30px; height: 30px; border-radius: 8px; background: rgba(255,107,44,0.18); display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="#ffd8c6" aria-hidden="true"><rect x="6" y="4.5" width="4" height="15" rx="1"></rect><rect x="14" y="4.5" width="4" height="15" rx="1"></rect></svg></span>
</button>
</div>
<button aria-label="Меню" style="width: 44px; height: 44px; border: 0; background: transparent; color: #e9ecf2; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
</header>

<section style="position: relative; z-index: 5; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 8px">
<label style="height: 44px; box-sizing: border-box; padding: 0 6px 0 12px; border-radius: 12px; border: 1px solid #2a303c; background: #1b2029; display: flex; align-items: center; gap: 8px; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ff8a55" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>
<input type="date" value="2026-10-26" aria-label="Дата тренування" style="background: transparent; border: 0; color: #e9ecf2; font-size: 16px; font-weight: 600; color-scheme: dark; outline: none; padding: 0; width: 132px">
</label>
<span style="flex-grow: 1"></span>
<div style="position: relative">
<button onClick="{{toggleMenu}}" aria-haspopup="menu" aria-expanded="{{menuOpen}}" aria-label="Ще дії з тренуванням" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #2a303c; background: {{menuBg}}; color: #e9ecf2; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
<div role="menu" aria-label="Дії з тренуванням" style="position: absolute; right: 0; top: 52px; z-index: 10; width: 248px; border-radius: 14px; background: #232935; border: 1px solid #333a48; box-shadow: 0 16px 36px rgba(0,0,0,0.5); padding: 6px; display: flex; flex-direction: column">
<button role="menuitem" onClick="{{closeMenu}}" style="height: 44px; border: 0; background: transparent; color: #e9ecf2; text-align: left; padding: 0 12px; border-radius: 10px; font: 500 15px Inter, sans-serif; cursor: pointer">Зберегти як програму</button>
<div style="height: 1px; background: #333a48; margin: 4px 6px"></div>
<button role="menuitem" onClick="{{closeMenu}}" style="height: 44px; border: 0; background: transparent; color: #ff7a6b; text-align: left; padding: 0 12px; border-radius: 10px; font: 600 15px Inter, sans-serif; cursor: pointer">Видалити тренування…</button>
</div>
</sc-if>
</div>
</div>
<input value="Full body" aria-label="Назва тренування" style="background: transparent; border: 0; border-bottom: 1px dashed #3a4150; color: #fff; font-size: 22px; font-weight: 700; padding: 4px 0 6px; outline: none; width: 100%">
</div>
<div style="display: flex; gap: 10px">
<button style="flex: 1 1 0; height: 48px; border-radius: 12px; border: 1px solid #2a303c; background: #1b2029; color: #e9ecf2; font: 700 15px Inter, sans-serif">Завершити</button>
<button style="flex: 1 1 0; height: 48px; border-radius: 12px; border: 0; background: #ff6b2c; color: #151922; font: 800 15px Inter, sans-serif">Зберегти</button>
</div>
<div style="display: flex; align-items: center; gap: 14px; font-size: 12px; color: #9aa2b1">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #828a99"></span>минулого разу</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #d08561"></span>ціль на сьогодні</span>
<span style="margin-left: auto">тап — підставити</span>
</div>
</section>

<main style="padding: 8px 16px 32px; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="5">
<article style="border-radius: 16px; background: #1b2029; border: 1px solid #262c38; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: flex-start; gap: 8px">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 19px; font-weight: 700; line-height: 1.25">{{c.name}}</h2>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<span style="height: 24px; padding: 0 8px; border-radius: 6px; background: #262c38; color: #b4bbc8; font-size: 12px; font-weight: 600; display: flex; align-items: center">{{c.meta}}</span>
<span style="height: 24px; padding: 0 8px; border-radius: 6px; background: {{c.statusBg}}; color: {{c.statusFg}}; font-size: 12px; font-weight: 600; display: flex; align-items: center">{{c.status}}</span>
</div>
</div>
<button aria-label="Прибрати вправу з тренування" style="width: 44px; height: 44px; flex-shrink: 0; margin: -8px -8px 0 0; border: 0; border-radius: 12px; background: transparent; color: #8a92a1; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button>
</div>

<div style="display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; background: #151922">
<svg width="22" height="14" viewBox="0 0 30 14" aria-hidden="true" style="flex-shrink: 0"><rect x="0" y="6" width="30" height="2" rx="1" fill="#9aa2b1" opacity="0.6"></rect><rect x="4" y="1" width="4" height="12" rx="1" fill="#ff8a55"></rect><rect x="22" y="1" width="4" height="12" rx="1" fill="#ff8a55"></rect></svg>
<span style="font-size: 13px; color: #e9ecf2; font-weight: 600">{{c.equip}}</span>
<span style="font-size: 13px; color: #828a99">·</span>
<span style="font-size: 13px; color: {{c.limbsFg}}; font-weight: 600">{{c.limbs}}</span>
</div>

<sc-if value="{{c.hasProgress}}" hint-placeholder-val="{{ false }}">
<div role="img" aria-label="{{c.progressAria}}" style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
<span style="font-size: 12px; color: #9aa2b1">До «Спробуй більше»</span>
<span style="font-size: 13px; color: #e9ecf2; font-weight: 700; font-variant-numeric: tabular-nums">{{c.pDone}} <span style="color: #828a99; font-weight: 500">з {{c.pTotal}} тренувань</span></span>
</div>
<div style="display: flex; gap: 4px">
<sc-for list="{{c.segs}}" as="g" hint-placeholder-count="3">
<div style="flex-grow: 1; height: 6px; border-radius: 3px; background: {{g.color}}"></div>
</sc-for>
</div>
</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 8px">
<label style="display: flex; align-items: center; gap: 10px">
<span style="font-size: 13px; color: #9aa2b1; flex-grow: 1">{{c.weightLabel}}</span>
<input class="ph" inputMode="decimal" value="{{c.weight}}" placeholder="{{c.weightPh}}" onFocus="{{c.weightFocus}}" onChange="{{c.weightChange}}" style="width: 120px; height: 44px; box-sizing: border-box; border-radius: 10px; border: 1px solid #2a303c; background: #151922; color: #fff; font-size: 16px; font-weight: 700; text-align: center">
</label>
<sc-if value="{{c.isBarbell}}" hint-placeholder-val="{{ false }}">
<label style="display: flex; align-items: center; gap: 10px">
<span style="font-size: 13px; color: #9aa2b1; flex-grow: 1">Гриф</span>
<select value="{{c.barVal}}" onChange="{{c.setBar}}" style="width: 120px; height: 44px; box-sizing: border-box; border-radius: 10px; border: 1px solid #2a303c; background: #151922; color: #fff; font: 600 15px Inter, sans-serif; padding: 0 10px; color-scheme: dark">
<option value="20">20 кг</option>
<option value="15">15 кг</option>
<option value="10">EZ 10 кг</option>
<option value="0">Без грифа</option>
</select>
</label>
</sc-if>
<sc-if value="{{c.isDumbbell}}" hint-placeholder-val="{{ false }}">
<label style="display: flex; align-items: center; gap: 10px">
<span style="font-size: 13px; color: #9aa2b1; flex-grow: 1">Гантелей в одному повторенні</span>
<select value="{{c.countVal}}" onChange="{{c.setCount}}" style="width: 120px; height: 44px; box-sizing: border-box; border-radius: 10px; border: 1px solid #2a303c; background: #151922; color: #fff; font: 600 15px Inter, sans-serif; padding: 0 10px; color-scheme: dark">
<option value="1">1</option>
<option value="2">2</option>
</select>
</label>
</sc-if>
<span style="font-size: 13px; color: #b4bbc8; text-align: right; font-variant-numeric: tabular-nums">{{c.loadLine}}</span>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; color: #9aa2b1">{{c.repsLabel}}</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{c.sets}}" as="s" hint-placeholder-count="3">
<div style="position: relative">
<input class="{{s.cls}}" inputMode="numeric" value="{{s.value}}" placeholder="{{s.ph}}" aria-label="{{s.label}}" onFocus="{{s.focus}}" onChange="{{s.change}}" style="width: 100%; height: 52px; box-sizing: border-box; border-radius: 10px; border: 1px solid #2a303c; background: #151922; color: #fff; font-size: 18px; font-weight: 700; text-align: center">
<span style="position: absolute; left: 6px; top: 4px; font-size: 10px; color: #828a99">{{s.n}}</span>
<sc-if value="{{s.up}}" hint-placeholder-val="{{ false }}">
<span aria-hidden="true" style="position: absolute; right: 6px; top: 3px; font-size: 11px; font-weight: 800; color: #d08561">↑</span>
</sc-if>
</div>
</sc-for>
<button onClick="{{c.addSet}}" aria-label="Додати підхід" style="height: 52px; border-radius: 10px; border: 1px dashed #4a3a33; background: transparent; color: #ff8a55; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<span style="font-size: 12px; color: #828a99">{{c.lastLine}}</span>
<div style="display: flex; justify-content: space-between; gap: 8px; padding-top: 10px; border-top: 1px solid #262c38; font-size: 13px">
<span style="color: #9aa2b1">Обсяг сьогодні</span>
<span style="color: #e9ecf2; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums">{{c.volumeLine}}</span>
</div>
</div>
</article>
</sc-for>

<button style="height: 52px; border-radius: 14px; border: 1px dashed #3a4150; background: transparent; color: #e9ecf2; font: 600 15px Inter, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Додати вправу</button>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":2600}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      menuOpen: false,
      list: [
        { name: 'Тяга в нахилі', meta: 'Велика група · 6–15', ok: false, status: 'Спробуй більше',
          equipment: 'barbell', count: 1, limbs: 'both', bar: 20, weight: '', weightPh: '16.25',
          last: [12, 12, 11], values: ['12', '12', ''], lastDate: '22.10' },
        { name: 'Підйом гантелей на біцепс', meta: 'Мала група · 6–20', ok: true, status: 'Прогрес у нормі',
          equipment: 'dumbbell', count: 2, limbs: 'both', weight: '', weightPh: '7.5',
          last: [14, 14, 14], values: ['14', '', ''], lastDate: '22.10' },
        { name: 'Випади', meta: 'Велика група · 6–15', ok: true, status: 'Прогрес у нормі',
          equipment: 'dumbbell', count: 2, limbs: 'leg', weight: '10', weightPh: '10',
          last: [13, 13, 13], values: ['13', '13', '13'], lastDate: '22.10' },
        { name: 'Французький жим сидячи', meta: 'Мала група · 6–20', ok: true, status: 'Прогрес у нормі',
          equipment: 'dumbbell', count: 1, limbs: 'arm', weight: '', weightPh: '5', progress: [1, 6],
          last: [12, 12, 12], values: ['', '', ''], lastDate: '22.10' },
        { name: 'Підняття ніг на прес (шведська стінка)', meta: 'Без ваги · 6–30', ok: true, status: 'Прогрес у нормі',
          equipment: 'bodyweight', count: 1, limbs: 'both', weight: '', weightPh: 'без ваги', progress: [1, 3],
          last: [15, 15, 15], values: ['15', '15', ''], lastDate: '22.10' }
      ]
    };
  }
  patch(i, fn) {
    this.setState({ list: this.state.list.map((e, j) => (j === i ? fn({ ...e }) : e)) });
  }
  renderVals() {
    const st = this.state;
    const fmt = (n) => { const r = Math.round(n * 100) / 100; return String(r).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); };
    const upOf = (e) => { if (e.ok) return -1; let m = 0; e.last.forEach((r, k) => { if (r < e.last[m]) m = k; }); return m; };
    const cards = st.list.map((e, i) => {
      const side = e.limbs === 'leg' ? 'ногу' : 'руку';
      const sides = e.limbs === 'both' ? 1 : 2;
      const w = parseFloat(e.weight || e.weightPh);
      const hasW = !isNaN(w);
      let load = 0, loadLine = '', equip = '', weightLabel = '';
      if (e.equipment === 'barbell') {
        load = e.bar + 2 * (hasW ? w : 0);
        loadLine = 'Гриф ' + e.bar + ' + 2 × ' + fmt(w) + ' = ' + fmt(load) + ' кг';
        equip = 'Штанга'; weightLabel = 'Диски на сторону, кг';
      } else if (e.equipment === 'dumbbell') {
        load = e.count * (hasW ? w : 0);
        loadLine = e.count === 2 ? '2 × ' + fmt(w) + ' = ' + fmt(load) + ' кг в одному повторенні' : fmt(w) + ' кг в одному повторенні';
        equip = e.count === 2 ? '2 гантелі' : '1 гантель'; weightLabel = 'Вага гантелі, кг';
      } else {
        load = hasW ? w : 0;
        loadLine = hasW ? 'Власна вага + ' + fmt(w) + ' кг' : 'Тільки власна вага';
        equip = 'Власна вага'; weightLabel = 'Додаткова вага, кг';
      }
      const limbs = e.limbs === 'both' ? 'кінцівки разом' : e.limbs === 'leg' ? 'кожна нога окремо' : 'кожна рука окремо';
      const u = upOf(e);
      const reps = e.values.reduce((a, v) => a + (parseInt(v, 10) || 0), 0);
      let volumeLine;
      if (!reps) volumeLine = '—';
      else if (load > 0) volumeLine = fmt(load) + ' кг × ' + reps + ' повт.' + (sides === 2 ? ' × 2 ' + (e.limbs === 'leg' ? 'ноги' : 'руки') : '') + ' = ' + fmt(load * reps * sides) + ' кг';
      else volumeLine = reps * sides + ' повторень';
      const p = e.progress;
      return {
        name: e.name, meta: e.meta, status: e.status,
        statusBg: e.ok ? '#17352a' : '#3a2a1a', statusFg: e.ok ? '#3ddc97' : '#ffb36b',
        equip, limbs, limbsFg: sides === 2 ? '#ffb36b' : '#b4bbc8',
        hasProgress: !!p, pDone: p ? p[0] : 0, pTotal: p ? p[1] : 0,
        progressAria: p ? 'До «Спробуй більше»: ' + p[0] + ' з ' + p[1] + ' тренувань у нормі' : '',
        segs: p ? Array.from({ length: p[1] }, (_, k) => ({ color: k < p[0] ? '#ff6b2c' : '#2a303c' })) : [],
        weightLabel, weight: e.weight, weightPh: e.weightPh,
        weightFocus: (ev) => {
          if (!e.weight && !isNaN(parseFloat(e.weightPh))) {
            this.patch(i, (x) => ({ ...x, weight: x.weightPh }));
            const t = ev.target; setTimeout(() => t.select(), 0);
          }
        },
        weightChange: (ev) => { const v = ev.target.value; this.patch(i, (x) => ({ ...x, weight: v })); },
        isBarbell: e.equipment === 'barbell', isDumbbell: e.equipment === 'dumbbell',
        barVal: String(e.bar), countVal: String(e.count),
        setBar: (ev) => { const n = Number(ev.target.value); this.patch(i, (x) => ({ ...x, bar: n })); },
        setCount: (ev) => { const n = Number(ev.target.value); this.patch(i, (x) => ({ ...x, count: n })); },
        loadLine,
        repsLabel: sides === 2 ? 'Підходи · повт. на кожну ' + side : 'Підходи · повторення',
        lastLine: 'Минулого разу (' + e.lastDate + '): ' + e.last.join(' / ') + (sides === 2 ? ' на ' + side : '') + (u >= 0 ? ' → сьогодні +1 у підході ' + (u + 1) : ''),
        volumeLine,
        sets: e.values.map((v, k) => {
          const base = e.last[k] ?? e.last[e.last.length - 1];
          const up = k === u;
          const ph = String(up ? base + 1 : base);
          return {
            n: k + 1, value: v, ph, up, cls: up ? 'ph-up' : 'ph',
            label: 'Підхід ' + (k + 1) + (sides === 2 ? ', повторень на кожну ' + side : ', повторень') + '. Минулого разу ' + base,
            focus: (ev) => {
              if (!v) {
                this.patch(i, (x) => { const values = x.values.slice(); values[k] = ph; return { ...x, values }; });
                const t = ev.target; setTimeout(() => t.select(), 0);
              }
            },
            change: (ev) => { const nv = ev.target.value; this.patch(i, (x) => { const values = x.values.slice(); values[k] = nv; return { ...x, values }; }); }
          };
        }),
        addSet: () => this.patch(i, (x) => ({ ...x, values: x.values.concat('') }))
      };
    });
    const open = st.menuOpen;
    return {
      cards, menuOpen: open, menuBg: open ? '#2a303c' : '#1b2029',
      toggleMenu: () => this.setState({ menuOpen: !open }),
      closeMenu: () => this.setState({ menuOpen: false })
    };
  }
}
</script>
</body>
</html>
