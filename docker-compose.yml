# Production stack: postgres + backend + frontend (static, served by its
# own nginx) + a top-level nginx reverse proxy that is the only container
# exposed to the host.
#
# Usage:
#   cp .env.example .env               # fill in real secrets + DOMAIN, CERTBOT_EMAIL
#   docker compose build
#   sh scripts/init-letsencrypt.sh     # first time only: gets the HTTPS certificate
#   docker compose up -d
#
# For local development with hot-reload, use docker-compose.dev.yml instead
# (see README.md).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # :? - без DOMAIN compose падає одразу (і деплой червоний), а не
      # запускає nginx з порожнім доменом, який крутиться в рестартах.
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      # шаблон -> /etc/nginx/conf.d/default.conf з підставленим ${DOMAIN}
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    # Раз на 6 годин перечитує конфіг, щоб підхопити поновлений сертифікат.
    # Потім запускає звичайний entrypoint образу (він і підставляє ${DOMAIN}).
    command: /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g 'daemon off;'"

  # Поновлює сертифікат Let's Encrypt (перевіряє двічі на добу; реально
  # поновлює лише коли до кінця дії лишилось < 30 днів).
  # Перший сертифікат отримується скриптом scripts/init-letsencrypt.sh.
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

volumes:
  postgres_data:
